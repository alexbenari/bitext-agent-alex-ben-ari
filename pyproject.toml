[project]
name = "bitext-agent"
version = "0.1.0"
description = "LangGraph data analyst agent for the Bitext customer-service dataset."
requires-python = ">=3.10,<3.14"
dependencies = [
    "python-dotenv>=1.0.1,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    "huggingface-hub>=0.27.0,<1.0.0",
    "langchain>=1.0.0,<2.0.0",
    "langchain-core>=1.0.0,<2.0.0",
    "langchain-openai>=1.0.0,<2.0.0",
    "langgraph>=1.0.0,<2.0.0",
    "langgraph-checkpoint-sqlite>=3.1.0,<4.0.0",
    "langsmith>=0.3.0,<1.0.0",
    "fastmcp>=2.0.0,<3.0.0",
    "streamlit>=1.36.0,<2.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.4,<9.0.0",
]

[tool.setuptools.packages.find]
include = ["bitext_agent*", "bitext_mcp*"]
